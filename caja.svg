<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-label="Caja de regalo premium negra con lazo de satín">
  <defs>
    <radialGradient id="f" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#fffdf9"/><stop offset=".6" stop-color="#fbf0f2"/><stop offset="1" stop-color="#f2d9de"/></radialGradient>
    <linearGradient id="frente" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c1216"/><stop offset=".6" stop-color="#2e1d23"/><stop offset="1" stop-color="#1a1014"/></linearGradient>
    <linearGradient id="tapa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a252c"/><stop offset="1" stop-color="#22151a"/></linearGradient>
    <linearGradient id="cinta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d0f26"/><stop offset=".5" stop-color="#c43552"/><stop offset="1" stop-color="#7d0f26"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#2a0a12" flood-opacity=".25"/></filter>
  </defs>
  <rect width="800" height="680" fill="url(#f)"/>
  <circle cx="400" cy="340" r="250" fill="none" stroke="#c9a45c" stroke-opacity=".35" stroke-dasharray="2 8"/>
  <g filter="url(#s)">
    <rect x="230" y="290" width="340" height="230" rx="10" fill="url(#frente)"/>
    <rect x="214" y="246" width="372" height="66" rx="10" fill="url(#tapa)"/>
    <rect x="214" y="300" width="372" height="12" fill="#000" opacity=".2"/>
    <!-- Cinta vertical y horizontal -->
    <rect x="380" y="246" width="40" height="274" fill="url(#cinta)"/>
    <rect x="214" y="268" width="372" height="22" fill="url(#cinta)" opacity=".95"/>
    <!-- Lazo -->
    <g transform="translate(400 250)">
      <path d="M0 0c-40-40-110-50-112-14-2 30 64 32 112 14z" fill="url(#cinta)"/>
      <path d="M0 0c40-40 110-50 112-14 2 30-64 32-112 14z" fill="url(#cinta)"/>
      <path d="M-70-24c24-8 46-4 62 14M70-24c-24-8-46-4-62 14" stroke="#ffd0d9" stroke-opacity=".45" stroke-width="3" fill="none"/>
      <ellipse rx="18" ry="14" fill="#b01e40"/>
    </g>
    <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#ead7a8" opacity=".9">para toda la vida</text>
  </g>
