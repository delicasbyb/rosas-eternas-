    <g transform="translate(400 440)">
      <path d="M0-46c12 0 16 8 26 10 10 4 18 10 18 24 0 10 6 16 2 28-4 10-14 12-20 20-8 8-14 12-26 12s-18-6-26-12c-6-8-16-10-20-20-4-12 2-18 2-28 0-14 8-20 18-24 10-2 14-10 26-10z" fill="url(#cera)"/>
      <circle r="28" fill="none" stroke="#5e0b20" stroke-opacity=".5" stroke-width="2"/>
      <path d="M0 12s-16-10-16-21a8 8 0 0 1 16-4 8 8 0 0 1 16 4C16 2 0 12 0 12z" fill="#c9a45c" opacity=".9"/>
    </g>
  </g>
  <!-- Pétalo decorativo -->
  <path d="M600 520c30-10 62 6 66 30-24 18-60 14-74-4-4-10 0-20 8-26z" fill="#b01e40" opacity=".85"/>
  <path d="M150 170c18-16 48-12 56 8-14 20-42 22-56 8-4-6-4-12 0-16z" fill="#c43552" opacity=".55"/>
